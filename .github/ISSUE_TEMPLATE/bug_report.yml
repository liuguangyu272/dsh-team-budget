name: Bug report / 问题反馈
description: Report a reproducible problem without API keys or private tokens.
body:
  - type: input
    id: versions
    attributes:
      label: DSH / Node.js / plugin versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected behavior / 复现步骤与预期
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
      description: Remove all API keys, tokens, private URLs and member data before sharing logs or images.
    validations:
      required: true
