services:
  gateway:
    build: ./gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8791:8791"
    environment:
      HOST: 0.0.0.0
      PORT: 8791
      GATEWAY_DATA_DIR: /data
      GATEWAY_PUBLIC_BASE: ${GATEWAY_PUBLIC_BASE:?Set GATEWAY_PUBLIC_BASE in .env}
    volumes:
      - gateway-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8791/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  gateway-data:
